<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Passive Voice Interactive App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f9f9f9;
      padding: 20px;
    }
    h1 {
      margin-bottom: 40px;
    }
    .example {
      margin-bottom: 50px;
    }
    .image {
      max-width: 400px;
      width: 90%;
      cursor: pointer;
      transition: transform 0.3s;
    }
    .image:hover {
      transform: scale(1.05);
    }

    /* Modal styles */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0,0,0,0.8);
    }
    .modal-content {
      margin: 5% auto;
      display: block;
      max-width: 90%;
    }
    .close {
      position: absolute;
      top: 30px;
      right: 50px;
      color: white;
      font-size: 40px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Active & Passive Voice Interactive Examples</h1>

  <div class="example">
    <h2>Example 1: Package Delivery</h2>
    <img id="packageImg" class="image" src="images/paquetes.jpg" alt="Package Delivery">
  </div>

  <div class="example">
    <h2>Example 2: Math Class</h2>
    <img id="classImg" class="image" src="images/clase.jpg" alt="Math Class">
  </div>

  <div class="example">
    <h2>Example 3: Professional Kitchen</h2>
    <img id="chefImg" class="image" src="images/cocina.jpg" alt="Professional Kitchen">
  </div>

  <!-- The Modal -->
  <div id="myModal" class="modal">
    <span class="close">&times;</span>
    <img class="modal-content" id="modalImage" src="">
  </div>

  <script>
    const modal = document.getElementById("myModal");
    const modalImg = document.getElementById("modalImage");
    const closeBtn = document.getElementsByClassName("close")[0];

    function showGuide() {
      modal.style.display = "block";
      modalImg.src = "images/guia.jpg";
    }

    document.getElementById("packageImg").addEventListener("click", showGuide);
    document.getElementById("classImg").addEventListener("click", showGuide);
    document.getElementById("chefImg").addEventListener("click", showGuide);

    closeBtn.onclick = function() {
      modal.style.display = "none";
    }

    window.onclick = function(event) {
      if (event.target == modal) {
        modal.style.display = "none";
      }
    }
  </script>
</body>
</html>
